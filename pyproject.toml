[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eosar-change-detection"
version = "0.2.0"
description = "Production-grade EO-SAR binary change detection training pipeline with DirectML support"
requires-python = ">=3.10"
authors = [{name = "GalaxEye Space", email = "contact@galaxeyespace.com"}]

dependencies = [
    "torch>=2.1.0",
    "torch-directml>=0.2.5; platform_system == 'Windows'",
    "numpy>=1.24.0",
    "albumentations>=1.4.0",
    "rasterio>=1.3.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "tensorboard>=2.14.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "huggingface-hub>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
